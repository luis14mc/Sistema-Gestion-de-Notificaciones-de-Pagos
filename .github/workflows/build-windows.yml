# Build ejecutable Windows y adjuntar al Release
# Sistema de Pagos CNI - Consejo Nacional de Inversiones

name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag del release (ej: v2.2.0)'
        required: true
        default: 'v2.2.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller --clean --noconfirm app_rrhh_cni.spec

      - name: Verify build
        run: |
          if (!(Test-Path dist\SistemaPagosCNI\SistemaPagosCNI.exe)) {
            Write-Error "Build failed - exe not found"
            exit 1
          }
          Get-ChildItem dist\SistemaPagosCNI

      - name: Set version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
            echo "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag=${{ github.event.inputs.tag }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create ZIP
        id: zip
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $zip = "SistemaPagosCNI_${tag}_Windows.zip"
          Compress-Archive -Path dist\SistemaPagosCNI -DestinationPath $zip -Force
          echo "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Sistema de Pagos CNI ${{ steps.version.outputs.tag }}
          files: ${{ steps.zip.outputs.zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
